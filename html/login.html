<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>會員登入</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <h2 class="auth-title">會員登入</h2>

    <form id="loginForm" novalidate>

      <label class="auth-label">Email</label>
      <input type="email" id="email" placeholder="請輸入 Email" required autocomplete="email">

      <label class="auth-label">密碼</label>
      <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="current-password">

      <!-- 🔥 錯誤訊息 -->
      <p id="msg" style="color:red; font-size:14px;"></p>

      <button type="submit" class="auth-btn">登入</button>

    </form>

    <div class="auth-links">
      <a href="register.html">註冊帳號</a>
      <a href="forgot.html">忘記密碼</a>
    </div>

  </div>
</div>

<script src="../js/login.js"></script>

</body>
</html>
