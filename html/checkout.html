<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳 | 茶貓商店</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .checkout-wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 32px;
    }

    .section-label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--tan);
      margin-bottom: 16px;
    }

    .order-summary {
      background: var(--sand);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 32px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
      color: var(--text);
      border-bottom: 1px solid rgba(201,169,110,0.2);
    }

    .order-row:last-child { border-bottom: none; }

    .order-row.total {
      font-size: 17px;
      font-weight: 500;
      color: var(--dark);
      padding-top: 14px;
    }

    .order-row.total span:last-child { color: var(--brown); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }
  </style>
</head>

<body class="has-nav">

<!-- NAVBAR -->
<nav class="nav">
  <a href="index.html" class="nav-logo">茶<span>貓</span>商店</a>
  <div class="nav-center">
    <a href="category.html?category=飼料">飼料</a>
    <a href="category.html?category=玩具">玩具</a>
    <a href="category.html?category=貓砂">貓砂</a>
    <a href="category.html?category=貓抓板">貓抓板</a>
    <a href="category.html?category=清潔用品">清潔用品</a>
    <a href="category.html?category=保健食品">保健食品</a>
  </div>
  <div class="nav-right">
    <a href="login.html" id="loginLink">登入</a>
    <a href="register.html" id="registerLink">註冊</a>
    <div class="member-menu hidden" id="memberMenu">
      <div class="member-trigger" id="memberTrigger">
        <img src="../img/user-avatar.png" class="avatar" onerror="this.style.display='none'">
        <span id="navEmail">會員</span> ▾
      </div>
      <div class="member-dropdown">
        <a href="member.html">會員中心</a>
        <a href="order-detail.html">我的訂單</a>
        <a href="#" id="logoutBtn">登出</a>
      </div>
    </div>
    <div class="admin-menu hidden" id="adminMenu">
      <a href="admin.html">後台管理</a>
      <a href="#" id="adminLogoutBtn">登出</a>
    </div>
    <a href="cart.html" class="nav-cart">
      🛍
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </div>
</nav>

<div class="checkout-wrapper">
  <h2 class="page-title">結帳</h2>

  <p class="section-label">訂單明細</p>
  <div class="order-summary" id="orderItems"></div>

  <div class="divider"></div>

  <p class="section-label">收件資訊</p>

  <div class="form-group">
    <label class="form-label">收件人姓名</label>
    <input class="form-input" type="text" id="receiver" placeholder="請輸入姓名" required>
  </div>

  <div class="form-group">
    <label class="form-label">聯絡電話</label>
    <input class="form-input" type="text" id="phone" placeholder="請輸入電話" required>
  </div>

  <div class="form-group">
    <label class="form-label">收件地址</label>
    <input class="form-input" type="text" id="address" placeholder="請輸入地址" required>
  </div>

  <p id="msg" class="msg-error"></p>

  <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="submitOrder()">確認送出訂單</button>
</div>

<script src="../js/checkout.js"></script>
<script>
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const box = document.getElementById('orderItems');
  let total = 0;

  if (!cart.length) {
    box.innerHTML = '<p style="color:var(--muted);font-size:14px;">購物車是空的</p>';
  } else {
    let rows = cart.map(item => {
      const sub = item.price * item.qty;
      total += sub;
      return `<div class="order-row"><span>${item.name} × ${item.qty}</span><span>$${sub}</span></div>`;
    }).join('');
    rows += `<div class="order-row total"><span>總金額</span><span>$${total}</span></div>`;
    box.innerHTML = rows;
  }
</script>

<script src="../js/navbar.js"></script>
</body>
</html>
