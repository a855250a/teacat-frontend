<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員中心 | 茶貓商店</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .member-wrapper {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 32px;
    }

    .member-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .member-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--sand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 16px;
    }

    .member-email {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .member-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .member-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body class="has-nav">

<!-- NAVBAR -->
<nav class="nav">
  <a href="index.html" class="nav-logo">茶<span>貓</span>商店</a>
  <div class="nav-center">
    <a href="category.html?category=飼料">飼料</a>
    <a href="category.html?category=玩具">玩具</a>
    <a href="category.html?category=貓砂">貓砂</a>
    <a href="category.html?category=貓抓板">貓抓板</a>
    <a href="category.html?category=清潔用品">清潔用品</a>
    <a href="category.html?category=保健食品">保健食品</a>
  </div>
  <div class="nav-right">
    <a href="login.html" id="loginLink">登入</a>
    <a href="register.html" id="registerLink">註冊</a>
    <div class="member-menu hidden" id="memberMenu">
      <div class="member-trigger" id="memberTrigger">
        <img src="../img/user-avatar.png" class="avatar" onerror="this.style.display='none'">
        <span id="navEmail">會員</span> ▾
      </div>
      <div class="member-dropdown">
        <a href="member.html">會員中心</a>
        <a href="order-detail.html">我的訂單</a>
        <a href="#" id="logoutBtn">登出</a>
      </div>
    </div>
    <div class="admin-menu hidden" id="adminMenu">
      <a href="admin.html">後台管理</a>
      <a href="#" id="adminLogoutBtn">登出</a>
    </div>
    <a href="cart.html" class="nav-cart">
      🛍
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </div>
</nav>

<div class="member-wrapper">
  <h2 class="page-title">會員中心</h2>

  <div class="member-card">
    <div class="member-avatar">🐱</div>
    <p class="member-email" id="userEmail">載入中...</p>
    <p class="member-label">會員帳號</p>

    <div class="divider"></div>

    <div class="member-actions">
      <a href="order-detail.html" class="btn-primary btn-sm">我的訂單</a>
      <button onclick="logout()" class="btn-danger btn-sm">登出</button>
    </div>
  </div>
</div>

<script src="../js/member.js"></script>
<script src="../js/navbar.js"></script>
</body>
</html>
