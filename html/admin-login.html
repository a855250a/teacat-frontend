<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台登入 | 茶貓商店</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">茶<span>貓</span>商店</div>

    <h2 class="auth-title">後台管理登入</h2>
    <p class="auth-subtitle">僅限授權管理員使用</p>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label">管理員帳號</label>
        <input class="form-input" type="text" id="username"
               placeholder="請輸入帳號" required>
      </div>

      <div class="form-group">
        <label class="form-label">密碼</label>
        <input class="form-input" type="password" id="password"
               placeholder="請輸入密碼" required>
      </div>

      <button type="submit" class="auth-btn">登入後台</button>
    </form>

    <div class="auth-links center" style="margin-top: 20px;">
      <a href="index.html">← 回到前台</a>
    </div>

  </div>
</div>

<script src="../js/admin-login.js"></script>

</body>
</html>
